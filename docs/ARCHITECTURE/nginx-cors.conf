# Nginx CORS configuration for api.zettaz.com
# Place this inside your API server block or within `location /api/`.
# Whitelists production and local dev origins, echoes Origin to support credentials,
# and returns 204 for OPTIONS preflight requests.

# Allow only these origins
# - Production frontend: https://cloud.zettaz.com
# - Local dev frontend:  http://localhost:5173

# Example usage inside your existing API server block:
# server {
#   server_name api.zettaz.com;
#   ...
#   location /api/ {
#     include /etc/nginx/snippets/nginx-cors.conf;
#     proxy_pass http://127.0.0.1:3001;
#     proxy_http_version 1.1;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#   }
# }

# 1) Core CORS headers for allowed origins
if ($http_origin ~* ^(https://cloud\.zettaz\.com|http://localhost:5173)$) {
    add_header 'Access-Control-Allow-Origin' "$http_origin" always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Vary' 'Origin' always;
    # Keep header names lower-case to match typical Access-Control-Request-Headers
    add_header 'Access-Control-Allow-Headers' 'content-type, authorization, x-request-id, x-tenant-id, tenant-id, x-store-id, store-id, x-requested-with' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    # Optionally expose custom response headers to JS (readable via fetch/axios)
    add_header 'Access-Control-Expose-Headers' 'x-request-id, content-disposition, x-total-count' always;
}

# 2) Preflight handling
if ($request_method = OPTIONS) {
    add_header 'Access-Control-Max-Age' '86400' always;
    return 204;
}
